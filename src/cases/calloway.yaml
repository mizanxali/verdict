# ════════════════════════════════════════════════════════════════════════════
#  Commonwealth of Aldermere v. Iris Calloway
# ════════════════════════════════════════════════════════════════════════════
#
#  Validated by src/cases/validate.ts on every load. Run `npx vitest run src/cases`
#  after editing.
#
#  ── Jury tuning ─────────────────────────────────────────────────────────────
#
#  Lean runs -10 (convict) to +10 (acquit). A juror votes not guilty when the
#  final lean >= acquitAt. 4 of 5 votes are needed either way, otherwise hung.
#  Only the gap (acquitAt - startLean) matters for the arithmetic below.
#
#  Assumptions, per juror, over a whole trial:
#    D     ordinary testimony, net: -1 (range about -2..+1; each exchange
#          moves a receptive juror 1 at most)
#    crack what one defence crack is worth to that juror (+1 or +2)
#    iris  what the prosecutor cracking Iris's lie costs (-1 or -2)
#
#    juror       start  acquitAt  gap   Renn crack  Arden crack  iris
#    osei          -1       0      1       +2          +2         -2   paper
#    kapoor         0       1      1       +1          +2         -1   anti-institution
#    lindqvist     -2       0      2       +2          +2         -2   character
#    hale          -1       0      1       +1          +1         -1   anti-overreach
#    ashdown       -2      -1      1       +1          +1         -2   authority
#
#  Net movement = D + cracks + iris; the juror acquits if net >= gap.
#
#    A. No defence cracks          osei -3  kapoor -2  lindqvist -3  hale -2  ashdown -3
#       -> 0 acquit, 5 convict: GUILTY. Still GUILTY at D = +1; D = +2 gives
#          kapoor and hale 1 each -> 2-3 HUNG. Weak spot: if the prosecutor
#          never cracks Iris's lie, D = +1 alone acquits (4 of 5 nets at +1).
#    B. Two cracks (one per witness)
#                                  osei +1  kapoor +1  lindqvist +1  hale  0  ashdown -1
#       -> osei, kapoor acquit; 3 convict: HUNG. Both Arden cracks: same, HUNG.
#          Both Renn cracks: kapoor nets 0 -> 1-4 GUILTY. So two cracks lands
#          on hung or narrow guilty.
#    C. All four cracks, no bluffing
#                                  osei +5  kapoor +4  lindqvist +5  hale +2  ashdown +1
#       -> 5 acquit (margins 4, 3, 3, 1, 0): NOT GUILTY, after Iris's crack.
#       If every crack scores only +1: osei +1, kapoor +2, lindqvist +1 (fails),
#       hale +2, ashdown +1 -> 4 acquit, still NOT GUILTY.
#       Bluffing: each flagged invented claim costs lindqvist and hale 1.
#       Two flagged claims drop hale to 0 (fails) -> 4 acquit, still NOT GUILTY;
#       three or more puts the result at risk.
#
#  To make the case harder, widen the gaps (raise acquitAt); to make it more
#  forgiving of a missed crack, lower lindqvist's gap to 1.
#
#  ── Voices ──────────────────────────────────────────────────────────────────
#
#  Each speaker may name a Deepgram Aura voice (`voice:`); jurors never speak and
#  the player is never voiced. Aura-2 has only two British voices (draco, pandora),
#  so the older Aura-1 catalogue supplies the mature British judge (athena), the
#  British clerk (helios) and the Irish guard (angus). Every voice must be
#  distinct. Leave one out and the server picks an unused fallback.
#
# ════════════════════════════════════════════════════════════════════════════

id: calloway
title: Commonwealth of Aldermere v. Iris Calloway
charge: >-
  Theft of the Halvorsen sapphire, and assault causing bodily harm to Tobias
  Renn, at the Halvorsen Museum on the night of 14 March.
playerSide: defence
defendantName: Iris Calloway

# ─── Public brief ───────────────────────────────────────────────────────────
# Seen by the player and every AI role. Agreed facts only.
publicBrief: |
  The Halvorsen Museum stands on Halvorsen Square in the old town of Aldermere.

  Ground floor: the front entrance with the guard desk, and beside it the staff entrance; the west wing, which houses the conservation studio; the east wing, with the plant room, service door SD-3 to the loading yard, and the garage link door through to Halvorsen Square Garage.
  Upper floor: the galleries, the director's office and, off the upper east corridor, the strongroom.
  The east stairwell joins the ground-floor east corridor to the upper east corridor. A north service stair also links the two floors.

  Since 10 March the Halvorsen sapphire has been kept in the strongroom while the museum's conservator, Iris Calloway, remounts its setting.

  Agreed facts:
  - At 11:44 pm on 14 March the night guard, Tobias Renn, phoned police from his mobile to report that he had been pushed down the east stairwell. Police arrived at 11:56 pm and he let them in at the front entrance.
  - Mr Renn had a sprained right wrist and bruised ribs. Paramedics treated him at the scene.
  - Police found the strongroom door closed and locked, and kept an officer in the building overnight.
  - At 7:41 am on 15 March the director, Celeste Arden, opened the strongroom in front of police. The sapphire's case was empty. The sapphire has not been found.
  - Police interviewed Ms Calloway at her flat at 8:30 am on 15 March (Exhibit E1) and arrested her that afternoon.
  - Ms Calloway pleads not guilty to both charges.

# ─── Rules of court ─────────────────────────────────────────────────────────
rules:
  objections:
    - type: relevance
      name: Relevance
      rule: >-
        Questions must bear on the events of 14 and 15 March, the people
        involved, or a witness's reliability. Questions about unrelated matters
        may be stopped.
      example: "Q: What do you think of the museum's new café?"
    - type: hearsay
      name: Hearsay
      rule: >-
        A witness may not repeat what someone else told them in order to prove
        it true. A witness may describe what they saw, heard and did, and may
        repeat what the defendant said to them; exhibits are not hearsay.
      example: "Q: What did the other guards tell you about Ms Calloway?"
    - type: leading
      name: Leading question
      rule: >-
        On direct examination a lawyer may not ask a question that suggests its
        own answer. On cross-examination leading questions are allowed.
      example: "On direct: You saw the defendant's face clearly, didn't you?"
    - type: speculation
      name: Speculation
      rule: >-
        A witness may not be asked to guess about things they did not see or
        cannot know, including what another person was thinking.
      example: "Q: Why do you suppose the director raised the insurance?"
    - type: assumes_facts
      name: Assumes facts not in evidence
      rule: >-
        A question may not take for granted a fact that is not in the record or
        the agreed facts.
      example: "Q: After you took the sapphire, where did you hide it?"
    - type: badgering
      name: Badgering the witness
      rule: >-
        A lawyer may not argue with, insult or harass a witness, or keep
        repeating a question that has already been answered.
      example: "Q: Come on, you're lying, aren't you? Aren't you?"
  evidence:
    - >-
      Only the exhibits in this case file exist. No one may refer to any other
      document, recording or object as though it existed.
    - An exhibit enters the record when a lawyer presents it to a witness during questioning.
    - Opening statements may preview any exhibit in the case file.
    - >-
      Closing statements may rely only on exhibits that have entered the record,
      testimony given in court, and the agreed facts.
    - >-
      A lawyer may not assert as fact anything that is not in the record or the
      agreed facts. A witness may be asked about it; a lawyer may not claim it.

# ─── Hidden truth ───────────────────────────────────────────────────────────
# Never shown to players, actors or jurors. Every exhibit and statement below
# is written to agree with this. knownBy lists witness ids.
timeline:
  - time: "21 Feb"
    event: >-
      Insurance on the sapphire raised from 2.4 to 6.5 million crowns at Arden's
      request, after a revaluation on 12 February. She is already planning to
      fake a theft and keep the stone.
    knownBy: [arden]
  - time: "02 Mar"
    event: Battery pack for the east stairwell emergency lights fails its test. Replacement ordered.
    knownBy: []
  - time: "03 Mar"
    event: Security supervisor Gareth Lyle's strongroom code (slot 06) suspended pending a re-key.
    knownBy: [arden]
  - time: "09 Mar"
    event: >-
      The Harbour at Vell comes to the conservation studio for re-framing. Iris
      writes to Arden that it may not be the painting bought in 2011.
    knownBy: [calloway, arden]
  - time: "10 Mar"
    event: >-
      The sapphire moves to the strongroom for its remount. Arden emails Iris her
      slot 04 code and forbids after-hours work and any handling of the Vell (E4).
    knownBy: [calloway, arden]
  - time: "14 Mar 08:39"
    event: Arden drives into Halvorsen Square Garage (director's bay) and badges in at the garage link at 08:44.
    knownBy: [arden]
  - time: "14 Mar 09:12-16:51"
    event: >-
      Iris works on the sapphire in the strongroom (09:12-12:30, 13:35-16:51).
      At 16:51 she puts it back in its case and closes the door.
    knownBy: [calloway]
  - time: "14 Mar 15:45"
    event: >-
      Renn drops his glasses at home and steps on them. At 16:30 the eye clinic
      orders a replacement pair, ready 17 March. He has no spare and goes to
      work without glasses.
    knownBy: [renn]
  - time: "14 Mar 17:48"
    event: Renn badges in for his night shift. Iris leaves at 18:10 and cycles home.
    knownBy: [renn, calloway]
  - time: "14 Mar 20:55"
    event: >-
      Arden says goodnight to Renn at the guard desk and walks off down the east
      corridor towards the garage link, then goes back up the north service
      stair to her office and stays there.
    knownBy: [arden, renn]
  - time: "14 Mar 21:42"
    event: >-
      Iris cycles back and badges in at the staff entrance with her camera bag
      and a UV torch. She tells Renn she will be an hour or so in the studio and
      asks him not to mention it to Arden.
    knownBy: [calloway, renn]
  - time: "14 Mar 21:47-23:50"
    event: >-
      Iris is in the conservation studio (west wing) the whole time, photographing
      The Harbour at Vell under raking and ultraviolet light and comparing it with
      the 2011 acquisition photographs. She never goes to the east wing.
    knownBy: [calloway]
  - time: "14 Mar 23:00"
    event: Renn acknowledges the hourly check prompt at the guard desk console.
    knownBy: [renn]
  - time: "14 Mar 23:12"
    event: >-
      Renn goes out through service door SD-3 into the loading yard to smoke,
      wedging the door open. The held-open alert sounds at the empty desk.
    knownBy: [renn]
  - time: "14 Mar 23:24"
    event: >-
      Arden, in the plant room, switches off breaker B to blind cameras 7 and 8.
      This also darkens the east stairwell. She climbs it by a small torch.
    knownBy: [arden]
  - time: "14 Mar 23:27"
    event: >-
      Arden opens the strongroom with her own master code (slot 01), believing
      the controller cannot log without mains power. It runs on battery and logs
      her. She takes the sapphire and closes the door at 23:31, then waits in
      her office.
    knownBy: [arden]
  - time: "14 Mar 23:37"
    event: >-
      Renn comes back in through SD-3 at the foot of the east stairwell. The
      stairwell is pitch dark. He hears footsteps above and starts up.
    knownBy: [renn]
  - time: "14 Mar 23:40"
    event: >-
      Arden, coming down with her torch switched off, meets Renn on the upper
      flight and shoves him aside. He falls to the half-landing. She hurries past
      him down to the ground floor. Neither sees the other's face.
    knownBy: [arden, renn]
  - time: "14 Mar 23:44"
    event: >-
      Renn phones police from his mobile and stays sitting on the half-landing.
      Knowing Iris is in the building, he assumes it was her.
    knownBy: [renn]
  - time: "14 Mar 23:51"
    event: >-
      Arden, who has waited in the plant room, resets breaker B so the cut looks
      like a trip. The stairwell lights come back on.
    knownBy: [arden, renn]
  - time: "14 Mar 23:52"
    event: >-
      Iris leaves by the staff entrance (camera 2), passing the empty guard desk,
      and cycles home. She has seen no one and heard nothing.
    knownBy: [calloway]
  - time: "14 Mar 23:53"
    event: Arden goes out through the garage link (exit not logged) and sits in her car with the sapphire.
    knownBy: [arden]
  - time: "14 Mar 23:57"
    event: >-
      Renn limps to the desk, cancels night mode and lets police in. He tells
      them he saw Iris Calloway's face clearly on the stairs.
    knownBy: [renn]
  - time: "15 Mar 00:07"
    event: >-
      Arden drives out of the garage. Police phone her at 00:25; she says she is
      at home and will come in first thing.
    knownBy: [arden]
  - time: "15 Mar 07:41"
    event: Arden opens the strongroom with police present. The case is empty.
    knownBy: [arden]
  - time: "15 Mar 08:30"
    event: >-
      Police call at Iris's flat. Frightened for her job after defying Arden's
      written instruction, she says she was at home all evening.
    knownBy: [calloway]
  - time: "15 Mar afternoon"
    event: >-
      Police obtain the badge log and arrest Iris. Arden tells them only Iris had
      a working strongroom code.
    knownBy: [arden, calloway]


# ─── Jurors ─────────────────────────────────────────────────────────────────
# persona is public; disposition is private to the jury scorer.
# startLean / acquitAt: see the tuning table at the top of this file.
jurors:
  - id: osei
    name: Margaret Osei
    persona: Retired bookkeeper, 67. Kept the accounts for a builder's merchant for thirty years.
    disposition: >-
      Trusts paper over people. Moves sharply (2) whenever a document
      contradicts what a witness says, whichever side it hurts, including when
      the prosecution catches the defendant with a record. Unmoved by demeanour,
      tears, or confident assertion with no document behind it. Ordinary
      testimony barely moves her.
    startLean: -1
    acquitAt: 0
  - id: kapoor
    name: Dev Kapoor
    persona: Delivery rider, 29. Works nights and has had his share of run-ins with management.
    disposition: >-
      Distrusts institutions and the people who run them: directors, insurers,
      management. A senior official caught out moves him strongly (2); a guard
      caught covering for himself moves him less (1), because he sees a worker
      protecting his job. Sympathetic to an employee who lied out of fear of her
      boss, so the defendant's lie costs her only a little with him (1). Cold to
      appeals to the museum's reputation or the director's standing.
    startLean: 0
    acquitAt: 1
  - id: lindqvist
    name: Agnes Lindqvist
    persona: Retired head teacher, 61. Spent thirty years working out who was telling the truth.
    disposition: >-
      Reads character. Watches how witnesses answer: evasions, sudden
      "imprecisions", glib polish. Any witness caught in a lie loses her trust
      sharply (2), the defendant included. Moved by plain remorse and candour
      after a mistake. Honesty-minded: a lawyer asserting something not in the
      record moves her 1 against that lawyer.
    startLean: -2
    acquitAt: 0
  - id: hale
    name: Victor Hale
    persona: Runs a small plumbing firm, 48. Likes people who get to the point.
    disposition: >-
      Impatient with lawyers who overreach: speeches dressed as questions,
      badgering, bluffing, objections that go nowhere. Rewards crisp, fair
      questioning that lands. A cracked lie moves him only 1, because he expects
      the other side to have an answer. Honesty-minded: an invented or
      unsupported claim from either lawyer moves him 1 against that lawyer.
    startLean: -1
    acquitAt: 0
  - id: ashdown
    name: Bernard Ashdown
    persona: Retired civil servant, 70. Thirty-five years at the Land Registry.
    disposition: >-
      Defers to authority: the police, the museum director, a guard with eleven
      years' service. Starts inclined to believe them, and takes the defendant's
      lie to police hard (2). Paper that forces an official to concede moves him,
      but only 1 each time; it takes several before he changes his mind. Unmoved
      by attacks on character or institutions with no document behind them.
    startLean: -2
    acquitAt: -1

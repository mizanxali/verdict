evidence:
  - id: E1
    title: Statement of Iris Calloway to police
    kind: witness statement
    text: |
      Aldermere Police. Statement of Iris Calloway, taken at her flat, 14 Tanner Street, 15 March, 8:30 am.

      "I left work at about ten past six yesterday and cycled home. I was at home all evening on my own. I made dinner, watched a film and went to bed at about eleven. I didn't go back to the museum. I haven't been in the strongroom since I finished the remount work at about ten to five yesterday, and the sapphire was in its case when I closed the door. I don't know anything about it going missing. Tobias is a friend. I'm sorry he's hurt."

      Signed: I. Calloway. Officer: Sgt P. Holm.

